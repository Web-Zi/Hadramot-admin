<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex"><title>إدارة منيو حضرموت</title>
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--m:#3a1b1b;--d:#2a1010;--g:#c9a24c;--c:#f2eadb;--y:#f4d21f;--r:#8a1c1c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;font-family:'El Messiri',Tahoma,sans-serif;background:var(--d);color:var(--c);padding:calc(8px + env(safe-area-inset-top,0px)) 14px calc(28px + env(safe-area-inset-bottom,0px))}
button{font:700 18px 'El Messiri',Tahoma,sans-serif;border:2px solid var(--g);border-radius:16px;padding:14px;background:var(--m);color:var(--c);cursor:pointer;touch-action:manipulation}
button.p{background:var(--y);color:var(--m);border-color:var(--y)}button.d{border-color:#e07070;color:#ffb0b0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--y)}
.hd{display:flex;align-items:center;gap:8px;min-height:56px;position:sticky;top:0;background:var(--d);z-index:3;padding:4px 0}
.hd h1{flex:1;margin:0;text-align:center;font-size:21px;color:var(--y);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hd button,.hd .sp{width:52px;height:46px;padding:0;font-size:22px;flex:none}
.col{display:grid;gap:12px;margin:12px auto 0;max-width:520px}
.big{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:right}.big small{color:var(--g);font-weight:600;white-space:nowrap}.big.off{opacity:.6}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.two button{font-size:15px;padding:10px}
.em{text-align:center;color:var(--g)}
.ph{height:190px;border-radius:18px;border:2px solid var(--g);background:#4a2222 center/contain no-repeat;display:grid;place-items:center;color:var(--g)}
.inf{background:var(--m);border:2px solid var(--g);border-radius:16px;padding:12px;display:grid;gap:4px}.inf b{font-size:20px}.inf span{color:var(--y);font-weight:700;font-size:20px}.inf p{margin:0;color:var(--c)}.inf em{color:#ffb0b0}
.lg{max-width:320px;margin:16vh auto;text-align:center;display:grid;gap:14px}.lg h1{color:var(--y);margin:0}
input,select,textarea{width:100%;font:600 18px 'El Messiri',Tahoma,sans-serif;padding:12px;border-radius:12px;border:2px solid var(--g);background:var(--c);color:var(--m)}
.lg input,.pin{text-align:center;font-size:26px;letter-spacing:10px}
.md{position:fixed;inset:0;background:var(--d);z-index:9;overflow:auto}
.bx{display:grid;gap:12px;align-content:start;max-width:520px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 110px}.bx h3{margin:0;color:var(--y);font-size:22px}
label{display:grid;gap:6px;font-weight:600}
.pv{height:170px;border-radius:14px;border:2px dashed var(--g);background:#4a2222 center/contain no-repeat}
.bt{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--m);border-top:2px solid var(--g)}.bt button{flex:1}
.ts{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--y);color:var(--m);font-weight:700;padding:10px 20px;border-radius:18px;z-index:30;max-width:90%;text-align:center}
</style></head><body><div id="app"></div>
<script>
const SB="https://apviifhixhzmnrpopdjy.supabase.co",KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFwdmlpZmhpeGh6bW5ycG9wZGp5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ5ODg2ODMsImV4cCI6MjExMDU2NDY4M30.QyzTtcnH_XEGXZWM3h70UsjaXSR5LdsVJGZuEtpQVgY",H={apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json"};
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const MSG={bad:"الرقم السري غير صحيح",locked:"تم القفل 15 دقيقة بعد محاولات خاطئة",fmt:"لازم 4 أرقام"};
let pin="",C=[],I=[],cat=null,item=null;
const get=t=>fetch(`${SB}/rest/v1/${t}`,{headers:H}).then(r=>r.json());
const rpc=(f,b={},p=pin)=>fetch(`${SB}/rest/v1/rpc/${f}`,{method:"POST",headers:H,body:JSON.stringify({p,...b})}).then(r=>r.json());
function toast(t){const e=document.createElement("div");e.className="ts";e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2600)}
const modal=h=>{const d=document.createElement("div");d.className="md";d.innerHTML=h;document.body.append(d);return d};
const done=async(r,m)=>{if(r=="ok"){toast(m||"تم الحفظ");await load();return true}toast(MSG[r]||"حدث خطأ");return false};
const ask=m=>new Promise(res=>{const d=modal(`<div class="bx"><h3>${esc(m)}</h3><div class="bt"><button class="d" id="y">نعم، احذف</button><button class="x">إلغاء</button></div></div>`);d.querySelector("#y").onclick=()=>{d.remove();res(true)};d.querySelector(".x").onclick=()=>{d.remove();res(false)}});
function shrink(f){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,560/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.72))};im.src=r.result};r.readAsDataURL(f)})}
function login(){$("#app").innerHTML=`<div class="lg"><h1>إدارة منيو حضرموت</h1><input id="pn" type="password" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="off" aria-label="الرقم السري"><button class="p" id="go">دخول</button></div>`;
const go=async()=>{const p=$("#pn").value;if(p.length!=4)return toast("اكتب 4 أرقام");let r;try{r=await rpc("admin_check",{},p)}catch(e){return toast("تعذر الاتصال")}if(r=="ok"){pin=p;cat=item=null;load()}else toast(MSG[r]||"خطأ")};
$("#go").onclick=go;$("#pn").onkeydown=e=>{if(e.key=="Enter")go()}}
async function load(){try{[C,I]=await Promise.all([get("categories?select=*&order=sort"),get("items?select=*&order=sort")])}catch(e){return toast("تعذر التحميل")}
if(cat&&!C.find(x=>x.id==cat))cat=null;if(item&&!I.find(x=>x.id==item))item=null;draw()}
function draw(){const c=C.find(x=>x.id==cat),it=I.find(x=>x.id==item),its=c?I.filter(i=>i.cat==c.id):[],v=it?"item":c?"items":"cats";let b="";
if(v=="cats")b=`<div class="col">${C.map(x=>`<button class="big" data-c="${esc(x.id)}"><span>${esc(x.title)}</span><small>${I.filter(i=>i.cat==x.id).length} صنف</small></button>`).join("")}<button class="p" id="nc">+ قسم جديد</button></div>`;
if(v=="items")b=`<div class="col">${its.map(i=>`<button class="big${i.hidden?" off":""}" data-i="${i.id}"><span>${esc(i.name)}</span><small>${esc(i.price)}${i.hidden?" · مخفي":""}</small></button>`).join("")||'<p class="em">لا توجد أصناف في هذا القسم</p>'}<button class="p" id="ni">+ صنف جديد</button><div class="two"><button id="ec">تعديل القسم</button><button class="d" id="dc">حذف القسم</button></div></div>`;
if(v=="item")b=`<div class="col"><div class="ph" style="background-image:${it.img?`url('${it.img}')`:"none"}">${it.img?"":"لا توجد صورة"}</div><div class="inf"><b>${esc(it.name)}</b><span>${esc(it.price)}</span><p>${esc(it.descr)}</p>${it.hidden?"<em>مخفي عن الزبائن</em>":""}</div><button class="p" id="ed">✏️ تعديل</button><button id="hv">${it.hidden?"👁 إظهار":"🙈 إخفاء"}</button><button class="d" id="dl">🗑 حذف</button></div>`;
$("#app").innerHTML=`<div class="hd">${v=="cats"?'<span class="sp"></span>':'<button id="bk" aria-label="رجوع">→</button>'}<h1>${esc(it?it.name:c?c.title:"اختر القسم")}</h1><button id="st" aria-label="الإعدادات">⚙</button></div>`+b;
$("#st").onclick=settings;
if($("#bk"))$("#bk").onclick=()=>{if(item)item=null;else cat=null;draw()};
document.querySelectorAll("[data-c]").forEach(x=>x.onclick=()=>{cat=x.dataset.c;draw()});
document.querySelectorAll("[data-i]").forEach(x=>x.onclick=()=>{item=+x.dataset.i;draw()});
if(v=="cats")$("#nc").onclick=()=>catForm({sort:C.length+1,kind:"list"});
if(v=="items"){$("#ni").onclick=()=>itemForm({cat:c.id,hidden:false,sort:(its.length?Math.max(...its.map(i=>i.sort)):0)+1});
$("#ec").onclick=()=>catForm(c);
$("#dc").onclick=async()=>{if(await ask("حذف القسم وكل أصنافه؟")){const r=await rpc("admin_cat_del",{id:c.id});cat=null;done(r,"تم الحذف")}}}
if(v=="item"){$("#ed").onclick=()=>itemForm(it);
$("#hv").onclick=async()=>done(await rpc("admin_item",{i:{...it,hidden:!it.hidden}}),it.hidden?"تم الإظهار":"تم الإخفاء");
$("#dl").onclick=async()=>{if(await ask("حذف "+it.name+"؟")){const r=await rpc("admin_item_del",{id:it.id});item=null;done(r,"تم الحذف")}}}}
const itemForm=v=>form(v.id?"تعديل الصنف":"صنف جديد",[{k:"name",l:"الاسم"},{k:"price",l:"السعر"},{k:"descr",l:"الوصف",t:"area"},{k:"img",l:"الصورة",t:"img"}],v,x=>rpc("admin_item",{i:{...v,...x}}));
const catForm=v=>form(v.id?"تعديل القسم":"قسم جديد",[{k:"title",l:"اسم القسم"},{k:"kind",l:"طريقة العرض",t:"sel",o:[["list","قائمة أسعار"],["cards","كروت بصور"]]},{k:"img",l:"صورة القسم",t:"img"}],v,x=>rpc("admin_cat",{c:{id:v.id||"c"+Date.now(),...v,...x,dk:x.kind=="cards"}}));
function form(t,F,v,save){const d=modal(`<form class="bx"><h3>${t}</h3>${F.map(f=>`<label>${f.l}${f.t=="area"?`<textarea name="${f.k}" rows="4">${esc(v[f.k])}</textarea>`:f.t=="sel"?`<select name="${f.k}">${f.o.map(o=>`<option value="${o[0]}"${o[0]==v[f.k]?" selected":""}>${o[1]}</option>`).join("")}</select>`:f.t=="img"?`<div class="pv"></div><input type="file" accept="image/*"><button type="button" class="rm">حذف الصورة</button>`:`<input name="${f.k}" value="${esc(v[f.k])}" autocomplete="off">`}</label>`).join("")}<div class="bt"><button class="p">حفظ</button><button type="button" class="x">إلغاء</button></div></form>`);
let im=v.img||"";const pv=d.querySelector(".pv"),sp=()=>pv.style.backgroundImage=im?`url('${im}')`:"none";sp();
const fi=d.querySelector("[type=file]");fi.onchange=async()=>{if(fi.files[0]){im=await shrink(fi.files[0]);sp()}};d.querySelector(".rm").onclick=()=>{im="";sp()};
d.querySelector(".x").onclick=()=>d.remove();
d.querySelector("form").onsubmit=async e=>{e.preventDefault();const o={};F.forEach(f=>{const el=d.querySelector(`[name="${f.k}"]`);o[f.k]=f.t=="img"?im:el.value.trim()});
if(!(o.name||o.title))return toast("الاسم مطلوب");
let r;try{r=await save(o)}catch(x){return toast("تعذر الاتصال")}if(r=="ok"){d.remove();await done(r)}else toast(MSG[r]||"حدث خطأ")}}
function settings(){const d=modal(`<div class="bx"><h3>⚙ الإعدادات</h3><label>اكتب الرقم السري للدخول<input id="s1" class="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off"></label><div class="bt"><button class="p" id="s2">فتح</button><button class="x">إلغاء</button></div></div>`);
d.querySelector(".x").onclick=()=>d.remove();
const open=async()=>{const p=d.querySelector("#s1").value;if(p.length!=4)return toast("اكتب 4 أرقام");let r;try{r=await rpc("admin_check",{},p)}catch(e){return toast("تعذر الاتصال")}
if(r!="ok")return toast(MSG[r]||"خطأ");
d.innerHTML=`<div class="bx"><h3>تغيير الرقم السري</h3><label>الرقم الجديد (4 أرقام)<input id="n1" class="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off"></label><label>أعد كتابة الرقم الجديد<input id="n2" class="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off"></label><button id="lk">🔒 قفل التطبيق</button><div class="bt"><button class="p" id="sv">حفظ</button><button class="x">إغلاق</button></div></div>`;
d.querySelector(".x").onclick=()=>d.remove();
d.querySelector("#lk").onclick=()=>{d.remove();pin="";login()};
d.querySelector("#sv").onclick=async()=>{const a=d.querySelector("#n1").value,b=d.querySelector("#n2").value;
if(!/^\d{4}$/.test(a))return toast("لازم 4 أرقام");if(a!=b)return toast("الرقمان غير متطابقين");
let r;try{r=await rpc("admin_pin",{np:a},p)}catch(e){return toast("تعذر الاتصال")}
if(r=="ok"){pin=a;d.remove();toast("تم تغيير الرقم السري")}else toast(MSG[r]||"حدث خطأ")}};
d.querySelector("#s2").onclick=open;d.querySelector("#s1").onkeydown=e=>{if(e.key=="Enter")open()}}
login();
</script></body></html>
