<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex"><title>إدارة منيو حضرموت</title>
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--m:#3a1b1b;--d:#2a1010;--g:#c9a24c;--c:#f2eadb;--y:#f4d21f;--r:#8a1c1c}
*{box-sizing:border-box}body{margin:0;font-family:'El Messiri',Tahoma,sans-serif;background:var(--d);color:var(--c);padding:calc(14px + env(safe-area-inset-top,0px)) 12px calc(30px + env(safe-area-inset-bottom,0px))}
h1{color:var(--y);font-size:24px;margin:0}h3{margin:0 0 10px;color:var(--y)}
button{font:600 15px 'El Messiri',Tahoma,sans-serif;border:1px solid var(--g);border-radius:18px;padding:6px 14px;background:var(--m);color:var(--c);cursor:pointer}
button.p{background:var(--y);color:var(--m);border-color:var(--y)}button.g{background:none}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--y)}
.lg{max-width:320px;margin:15vh auto;text-align:center;display:grid;gap:14px}
input,select,textarea{width:100%;font:600 16px 'El Messiri',Tahoma,sans-serif;padding:9px 12px;border-radius:12px;border:2px solid var(--g);background:var(--c);color:var(--m)}
input[type=checkbox]{width:22px;height:22px}.lg input{text-align:center;font-size:24px;letter-spacing:8px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}.top div{display:flex;gap:6px}
.tabs,.bar{display:flex;gap:8px;overflow-x:auto;padding:6px 0 10px}.tabs button{white-space:nowrap}.tabs button.on{background:var(--y);color:var(--m);border-color:var(--y)}.bar{flex-wrap:wrap}
.ls{display:grid;gap:8px}.r{display:flex;align-items:center;gap:8px;background:var(--m);border:1px solid var(--g);border-radius:14px;padding:8px}.r.off{opacity:.55}
.th{flex:none;width:52px;height:52px;border-radius:50%;border:2px solid var(--g);background:#4a2222 center/cover}.nm{flex:1;min-width:0}.nm b,.nm small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nm small{color:var(--g)}
.pc{color:var(--y);font-weight:700;white-space:nowrap}.r button{padding:4px 10px;font-size:13px}
.md{position:fixed;inset:0;background:#000b;z-index:9;overflow:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 12px}.bx{max-width:460px;margin:0 auto;background:var(--m);border:2px solid var(--g);border-radius:18px;padding:16px;display:grid;gap:10px}
label{display:grid;gap:4px;font-weight:600}.pv{height:120px;border-radius:12px;border:2px dashed var(--g);background:#4a2222 center/contain no-repeat}.bt{display:flex;gap:8px}
.ts{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--y);color:var(--m);font-weight:700;padding:8px 18px;border-radius:18px;z-index:20}
</style></head><body><div id="app"></div>
<script>
const SB="https://apviifhixhzmnrpopdjy.supabase.co",KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFwdmlpZmhpeGh6bW5ycG9wZGp5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ5ODg2ODMsImV4cCI6MjExMDU2NDY4M30.QyzTtcnH_XEGXZWM3h70UsjaXSR5LdsVJGZuEtpQVgY",H={apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json"};
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const MSG={bad:"الرقم السري غير صحيح",locked:"تم القفل 15 دقيقة بعد محاولات خاطئة",fmt:"لازم 4 أرقام"};
let pin="",C=[],I=[],cur=null;
const get=t=>fetch(`${SB}/rest/v1/${t}`,{headers:H}).then(r=>r.json());
const rpc=(f,b={})=>fetch(`${SB}/rest/v1/rpc/${f}`,{method:"POST",headers:H,body:JSON.stringify({p:pin,...b})}).then(r=>r.json());
function toast(t){const e=document.createElement("div");e.className="ts";e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2600)}
const done=r=>{if(r=="ok"){toast("تم الحفظ");load()}else toast(MSG[r]||"حدث خطأ")};
function shrink(f){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,560/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.72))};im.src=r.result};r.readAsDataURL(f)})}
function login(){$("#app").innerHTML=`<div class="lg"><h1>إدارة منيو حضرموت</h1><input id="pn" type="password" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="off" aria-label="الرقم السري"><button class="p" id="go">دخول</button></div>`;
const go=async()=>{pin=$("#pn").value;if(pin.length!=4)return toast("اكتب 4 أرقام");let r;try{r=await rpc("admin_check")}catch(e){return toast("تعذر الاتصال")}if(r=="ok")load();else toast(MSG[r]||"خطأ")};
$("#go").onclick=go;$("#pn").onkeydown=e=>e.key=="Enter"&&go()}
async function load(){try{[C,I]=await Promise.all([get("categories?select=*&order=sort"),get("items?select=*&order=sort")])}catch(e){return toast("تعذر التحميل")}
if(!C.find(c=>c.id==cur))cur=C[0]?.id;draw()}
function draw(){const c=C.find(x=>x.id==cur),its=I.filter(i=>i.cat==cur);
$("#app").innerHTML=`<div class="top"><h1>إدارة المنيو</h1><div><button class="g" id="pw">الرقم السري</button><button class="g" id="ex">خروج</button></div></div>
<div class="tabs">${C.map(x=>`<button data-c="${esc(x.id)}" class="${x.id==cur?"on":""}">${esc(x.title)}</button>`).join("")}<button class="p" id="nc">+ قسم</button></div>
${c?`<div class="bar"><button class="g" id="ec">تعديل القسم</button><button class="g" id="dc">حذف القسم</button><button class="p" id="ni">+ صنف جديد</button></div>
<div class="ls">${its.map(i=>`<div class="r${i.hidden?" off":""}"><i class="th" style="background-image:${i.img?`url('${i.img}')`:"none"}"></i><div class="nm"><b>${esc(i.name)}</b><small>${esc(i.descr)}</small></div><span class="pc">${esc(i.price)}</span><button data-a="v" data-i="${i.id}">${i.hidden?"إظهار":"إخفاء"}</button><button data-a="e" data-i="${i.id}">تعديل</button><button data-a="d" data-i="${i.id}">حذف</button></div>`).join("")||"<p>لا توجد أصناف في هذا القسم</p>"}</div>`:""}`;
$("#pw").onclick=()=>form("تغيير الرقم السري",[{k:"np",l:"الرقم الجديد (4 أرقام)",t:"password"}],{},v=>/^\d{4}$/.test(v.np)?rpc("admin_pin",{np:v.np}).then(r=>{if(r=="ok")pin=v.np;return r}):"fmt");
$("#ex").onclick=()=>{pin="";login()};
document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{cur=b.dataset.c;draw()});
$("#nc").onclick=()=>catForm({sort:C.length+1,kind:"list"});
if(!c)return;
$("#ec").onclick=()=>catForm(c);
$("#dc").onclick=()=>confirm("حذف القسم وكل أصنافه؟")&&rpc("admin_cat_del",{id:c.id}).then(done);
$("#ni").onclick=()=>itemForm({cat:cur,sort:(its.length?Math.max(...its.map(i=>i.sort)):0)+1});
document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{const i=I.find(x=>x.id==b.dataset.i),a=b.dataset.a;
if(a=="e")itemForm(i);else if(a=="d")confirm("حذف "+i.name+"؟")&&rpc("admin_item_del",{id:i.id}).then(done);else rpc("admin_item",{i:{...i,hidden:!i.hidden}}).then(done)})}
const itemForm=v=>form(v.id?"تعديل صنف":"صنف جديد",[{k:"name",l:"الاسم"},{k:"price",l:"السعر (رقم أو نص)"},{k:"descr",l:"الوصف (للكروت)",t:"area"},{k:"cat",l:"القسم",t:"sel",o:C.map(x=>[x.id,x.title])},{k:"sort",l:"الترتيب",t:"number"},{k:"hidden",l:"مخفي عن الزبائن",t:"chk"},{k:"img",l:"الصورة",t:"img"}],v,x=>rpc("admin_item",{i:{...v,...x}}));
const catForm=v=>form(v.id?"تعديل قسم":"قسم جديد",[{k:"title",l:"اسم القسم"},{k:"kind",l:"طريقة العرض",t:"sel",o:[["list","قائمة أسعار"],["cards","كروت بصور"]]},{k:"dk",l:"خلفية داكنة",t:"chk"},{k:"sort",l:"الترتيب",t:"number"},{k:"img",l:"صورة القسم",t:"img"}],v,x=>rpc("admin_cat",{c:{id:v.id||"c"+Date.now(),...v,...x}}));
function form(t,F,v,save){const d=document.createElement("div");d.className="md";
d.innerHTML=`<form class="bx"><h3>${t}</h3>${F.map(f=>`<label>${f.l}${f.t=="area"?`<textarea name="${f.k}" rows="3">${esc(v[f.k])}</textarea>`:f.t=="sel"?`<select name="${f.k}">${f.o.map(o=>`<option value="${esc(o[0])}"${o[0]==v[f.k]?" selected":""}>${esc(o[1])}</option>`).join("")}</select>`:f.t=="chk"?`<input type="checkbox" name="${f.k}"${v[f.k]?" checked":""}>`:f.t=="img"?`<div class="pv"></div><input type="file" accept="image/*"><button type="button" class="g rm">حذف الصورة (يرجع للافتراضية)</button>`:`<input name="${f.k}" type="${f.t||"text"}" value="${esc(v[f.k])}"${f.t=="password"?' inputmode="numeric" maxlength="4"':""}>`}</label>`).join("")}<div class="bt"><button class="p">حفظ</button><button type="button" class="g x">إلغاء</button></div></form>`;
document.body.append(d);let im=v.img||"";const pv=d.querySelector(".pv"),sp=()=>pv&&(pv.style.backgroundImage=im?`url('${im}')`:"none");sp();
const fi=d.querySelector("[type=file]");if(fi){fi.onchange=async()=>{if(fi.files[0]){im=await shrink(fi.files[0]);sp()}};d.querySelector(".rm").onclick=()=>{im="";sp()}}
d.querySelector(".x").onclick=()=>d.remove();
d.querySelector("form").onsubmit=async e=>{e.preventDefault();const o={};F.forEach(f=>{const el=d.querySelector(`[name="${f.k}"]`);if(f.t=="img")o.img=im;else if(f.t=="chk")o[f.k]=el.checked;else if(f.t=="number")o[f.k]=+el.value||0;else o[f.k]=el.value.trim()});
if(F[0].k=="name"&&!o.name||F[0].k=="title"&&!o.title)return toast("الاسم مطلوب");
let r;try{r=await save(o)}catch(x){return toast("تعذر الاتصال")}if(r=="ok"){d.remove();done(r)}else toast(MSG[r]||"حدث خطأ")}}
login();
</script></body></html>
